services:
  - type: web
    name: mtaa-market-api
    runtime: node
    plan: starter
    rootDir: backend/api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    disk:
      name: mtaa-market-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: MTAA_DATABASE_PATH
        value: /var/data/mtaa_market.db
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://mtaa-market-frontend.onrender.com

  - type: web
    name: mtaa-market-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://mtaa-market-api.onrender.com
